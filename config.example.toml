#### PLAYER OPTIONS ####
[player]
# Which player Absotui launches: "vlc" or "mpv". Also changeable in Settings > Player.
# The cvlc, cvlc_term, address and port options below only apply to VLC.
backend = "vlc"

# By default, Absotui integrated player is launched (works with cvlc, launched in background, the command line
# version of vlc).
# 0: No, 1: Yes
# Launch Absotui integrated player:
# Set to 0 if you want to have vlc GUI.
cvlc = "1"
# Launch a terminal to control cvlc:
# NOTE: `cvlc` must be set to 1 if you set `cvlc_term` to 1.
cvlc_term = "0"

# #### PLAYER NETWORK ####
# By default, the player is launched to "localhost:1234"
# Address:
address = "localhost"
# Port:
port = "1234"

#### SIGN-IN ####
[auth]
# Signing in with SSO (OpenID Connect) sends your browser back to this machine, at
# http://127.0.0.1/callback. The Audiobookshelf admin has to allow that exact address
# under Settings > Authentication > Allowed Mobile Redirect URIs. Where Absotui can't
# listen on that address (most Linux systems), copy the address your browser ends up
# on and paste it into Absotui. There's no port setting: Audiobookshelf can't be told
# to allow an address with a port number.

#### DOWNLOADS ####
[downloads]
# When Settings > Auto Download is turned on, this is how many books from the top of
# Continue Listening (most recently played first) get kept downloaded for offline
# playback. Anything beyond this count that was previously downloaded gets pruned.
auto_download_count = 5
